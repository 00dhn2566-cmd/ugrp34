# rl_planner 기본 설정 — 모든 숫자의 단일 진실원.
#
# 덮어쓰기 순서: default.yaml → --config <실험.yaml> (여러 개 가능) → --set a.b=c
# 학습 run 폴더에는 병합된 최종 설정이 config.yaml 로 저장되고, export 된 정책의
# policy_meta.json 에도 그대로 들어간다 (과거 "학습 step=0.3 vs 기본 0.6" 오독 재발 방지).
#
# 단위: m, s, rad(이름에 _deg 가 붙은 것만 도). 좌표계: world +Z up (CONVENTIONS.md).

seed: 0
device: cuda            # cuda | cpu

# ---------------------------------------------------------------------------
# 시뮬레이션 백엔드
# ---------------------------------------------------------------------------
sim:
  backend: torch        # torch (순수 torch 강체 적분, Isaac 불필요) | isaac (Isaac Lab / PhysX)
  physics_dt: 0.01      # 물리·저수준 제어 주기 [s] (100 Hz)
  decimation: 10        # 정책 결정 1회당 물리 스텝 수 → 결정 주기 0.1 s (10 Hz)
  episode_length_s: 45.0
  num_envs: 1024
  gravity: 9.81

# ---------------------------------------------------------------------------
# 기체 — FX450, 성진 DYNAMICS.md §9.2 (짐 1 kg 구성이 기본)
# ---------------------------------------------------------------------------
drone:
  mass: 2.2726                       # [kg] 짐 1 kg 포함
  inertia: [1.711e-2, 1.716e-2, 2.124e-2]   # [kg m^2] 대각
  thrust_to_weight: 2.0              # 총 최대추력 / 무게 (planner_limits 물리 한계 근거)
  torque_max: [2.0, 2.0, 0.3]        # [N m] 몸체 토크 포화 (유효 모멘트 암 0.093 m × 최대 차동추력 근사)
  collision_radius: 0.30             # [m] 충돌 판정 구 반경 (휠베이스 450 mm/2 + 프롭 일부)
  safety_margin: 0.35                # [m] planner_limits.clearance_margin — 보상·평가의 "안전 통과" 기준
  linear_drag: 0.10                  # [N/(m/s)] 선형 항력 계수
  motor_time_constant: 0.03          # [s] 추력·토크 1차 지연
  start_pos: [0.0, 0.0, 1.0]         # 이륙 후 호버 시작점 (prototype 씬과 동일)
  start_pos_noise: [0.3, 0.3, 0.2]   # 시작점 균등 잡음 반폭

# ---------------------------------------------------------------------------
# 저수준 제어기 (Lee SE(3) 위치 제어 — Isaac Lab drone 예제와 같은 계열)
# 성진 PID 로 바꾸려면 controller.type 에 새 구현을 등록 (README "확장" 참고)
# ---------------------------------------------------------------------------
controller:
  type: lee_position
  kp_pos: [1.6, 1.6, 2.0]            # 위치오차 → 속도명령 [1/s]
  kv: [3.0, 3.0, 4.0]                # 속도오차 → 가속명령 [1/s]
  k_rot: [100.0, 100.0, 30.0]        # 자세 게인 (관성 정규화: ω_n = 10 rad/s)
  k_omega: [16.0, 16.0, 10.0]        # 각속도 게인 (관성 정규화: ζ ≈ 0.8)
  v_max: [2.0, 2.0, 1.0]             # 속도명령 포화 [m/s] (planner_limits 물리 한계)
  a_max: 2.0                         # 수평 가속 포화 [m/s^2]
  max_tilt_deg: 35.0
  yaw_target: 0.0                    # 기본 yaw 고정 — traj_manager YAW_FIXED 와 같은 결정
  i_max_acc: 1.5                     # 속도 적분항 출력 상한 [m/s^2] (적분 게인은 domain_randomization.ctrl_ki — 기본 0 = 적분항 없음)

# ---------------------------------------------------------------------------
# 씬 (창문 배치) — prototype_demo/pybullet_window_env 의 분포를 기본으로,
# 커리큘럼 레벨별로 범위를 넓힌다. 값이 [lo, hi] 면 균등 샘플.
# ---------------------------------------------------------------------------
scene:
  max_windows: 5                     # 텐서 크기 (레벨별 실제 개수는 curriculum 에서)
  first_gap: [2.4, 3.6]              # 시작점 → 첫 창문 x 거리
  spacing: [2.6, 3.6]                # 창문 간 x 간격 (GATE_STANDOFF 2.5 m 이상)
  lateral: [-0.6, 0.6]               # 창문 중심 y
  height: [0.8, 1.6]                 # 창문 중심 z
  yaw_deg: [0.0, 0.0]                # 창문 법선 yaw 기울기 (커리큘럼으로 확대)
  opening_w: [0.95, 1.10]            # 개구부 폭 (opening 1.0 + U(-0.05, 0.1))
  opening_h: [0.95, 1.10]
  wall_half_extent: 1.0e6            # 창문을 둘러싼 벽 반폭 [m]. 크게 = 무한 벽(돌아가기 불가)
  bounds:                            # 이탈 판정 (시작점 기준이 아니라 world)
    x_min: -2.0
    y_abs: 4.0
    z_min: 0.15                      # 지면 충돌
    z_max: 3.5
  max_tilt_deg: 70.0                 # 전복 판정

# ---------------------------------------------------------------------------
# 인지 대리 모델 — 검출기(길남 YOLO-pose) + 광선 삼각측량(recon_rays / 태민 노드)
# 정책은 GT 창문 위치를 절대 보지 않는다 (README §7.1). 이 모듈이 내는 추정치만 본다.
# ---------------------------------------------------------------------------
perception:
  camera:                            # prototype_demo/config/camera.yaml (잠정 확정 후보)
    width: 1280
    height: 720
    fx: 763.0
    fy: 763.0
    cx: 640.0
    cy: 360.0
    offset_body: [0.0, 0.0, 0.0]     # 카메라 위치 (body) — spec §6.1 병진 기본 0
  frame_every: 1                     # 결정 스텝 몇 번마다 카메라 1장 (1 = 10 Hz)
  corner_noise_px: [2.0, 9.0]        # 코너 픽셀 잡음 σ (DR, 실측 검출기 8.87 px)
  outlier_prob: 0.0                  # 코너 아웃라이어 확률 (σ×6)
  miss_prob: [0.0, 0.1]              # 검출 누락 확률 (DR)
  det_conf_min: 0.5                  # recon_rays det_conf_min
  conf_side_px50: 25.0               # 짧은 변 픽셀 길이가 이 값일 때 conf 0.5
  conf_side_px_scale: 8.0
  min_side_px: 12.0                  # 이보다 작으면 검출 안 함
  image_margin_px: 4.0               # 코너 4개가 모두 이 여백 안에 있어야 검출 (데이터셋 정책 A)
  max_range: 15.0
  max_incidence_deg: 70.0            # 창문 법선과 시선 사이 각
  min_parallax_deg: 2.0              # recon_rays MIN_PARALLAX_DEG 게이트
  ridge: 1.0e-6                      # 최소자승 정칙화
  # --- 스트레스 테스트용 손잡이 (기본값 = 효과 없음, 학습에는 쓰지 않음) ---
  noise_scale: 1.0                   # 레벨별 코너 잡음 σ 에 곱하는 배율
  calib_fx_scale: 1.0                # 실제 카메라 초점거리 / 보정값 (삼각측량은 보정값 사용 → 보정 오차)
  pose_noise_m: 0.0                  # 광선을 쏘는 카메라 위치 잡음 σ [m] (VIO 오차)
  pose_noise_deg: 0.0                # 광선을 쏘는 카메라 yaw 잡음 σ [deg] (VIO 오차)
  blackout_s: null                   # [t0, t1] 이 시간 동안 카메라 프레임 없음 (일시적 인지 상실)
  latency_steps: 0                   # 검출 지연 [결정 스텝, 1 = 0.1 s]: 찍은 프레임이 이만큼 늦게 삼각측량·관측에 들어감
  latency_jitter_steps: 0            # 지연 변동 [결정 스텝]: 매 결정 지연 = latency_steps + U{0..이 값}, 이미 받은 것보다 옛 프레임은 버림(최신 프레임만)
  frame_drop_prob: 0.0               # 결정마다 카메라 프레임을 이 확률로 잃음 (전송·처리 누락)
  pose_drift_m: 0.0                  # VIO 위치 드리프트: 광선을 쏘는 카메라 위치의 랜덤워크 σ [m/√s] (에피소드 시작 0)
  cam_rot_err_deg: 0.0               # 카메라 장착(외부 보정) 오차 [deg]: 실제 카메라가 에피소드마다 임의 축으로 이만큼 돌아가 있음 — 삼각측량은 공칭 장착을 씀

# ---------------------------------------------------------------------------
# 행동 — 정책 출력 = 다음 웨이포인트 (README §7.3, CONVENTIONS "RL boundaries")
# ---------------------------------------------------------------------------
action:
  type: waypoint_delta               # 현재 위치 + heading 프레임 변위
  step_max: [0.8, 0.6, 0.4]          # [-1,1] → 변위 [m] (x 전진, y 좌, z 위)
  yaw: false                         # true 면 4번째 행동 = yaw 변화율 (기본 yaw 고정)

# ---------------------------------------------------------------------------
# 관측 — 항목 순서가 곧 벡터 레이아웃. export 시 policy_meta.json 에 이름·구간 기록.
# 항목 구현: rl_planner/core/observations.py 의 레지스트리.
# ---------------------------------------------------------------------------
observation:
  policy:                            # 실기에서도 얻을 수 있는 것만 (VIO + IMU + 검출 + 복원)
    - lin_vel_heading
    - gravity_body
    - ang_vel_body
    - altitude
    - last_action
    - target_estimate
    - target_detection
    - next_estimate
    - progress
  critic:                            # 비대칭 actor-critic: 학습 때만 쓰는 특권 정보
    - target_gt
    - next_gt
    - estimate_error
  noise:                             # 정책 관측 잡음 (VIO·IMU 오차 흉내, DR)
    lin_vel: 0.05
    gravity: 0.02
    ang_vel: 0.05
    altitude: 0.03

# ---------------------------------------------------------------------------
# 보상 — 가중치만 여기서 바꾼다 (README §7.2). 항목 구현: core/rewards.py
# 진행 보상·통과 보너스·충돌 벌점·시야 보상 구성은 드론 레이싱 RL 표준
# (Song et al. 2021; Kaufmann et al. 2023 "Swift") 을 따른다.
# ---------------------------------------------------------------------------
reward:
  progress: 1.0                      # 목표 창문 중심까지 거리 감소량 [m]
  window_pass: 10.0                  # 목표 창문 통과
  pass_clearance: 5.0                # 통과 시 여유(safety_margin 대비) 비율 보너스
  mission_success: 20.0              # 전 창문 통과
  crash: -20.0                       # 벽·지면·전복·이탈·순서 위반
  perception: 0.01                   # 카메라 광축과 목표 방향 정렬 exp(-angle^4) (time 벌점보다 작게: 제자리 응시로 이득 못 보게)
  estimate_improve: 2.0              # 추정 오차 감소 (potential-based → 해킹 불가)
  time: -0.02                        # 매 스텝
  action_rate: -0.02                 # |a_t - a_t-1|^2
  ang_vel: -0.005                    # |omega|^2
  estimate_error_cap: 1.0            # estimate_improve 의 오차 상한 [m]

# ---------------------------------------------------------------------------
# 커리큘럼 — 환경별 레벨. 성공하면 +1, 충돌하면 -1 (Isaac Lab terrain level 방식).
# 각 레벨은 scene/perception 의 일부를 덮어쓴다. 없는 키는 위 기본값.
# ---------------------------------------------------------------------------
curriculum:
  enabled: true
  promote_on: success                # success | windows
  demote_on_crash: true
  init_level_max: 0                  # 리셋 시 시작 레벨 상한 (0 = 모두 레벨 0 시작)
  fixed_level: null                  # 정수면 커리큘럼 없이 모든 환경을 이 레벨로 학습 (ablation)
  override: {}                       # 모든 레벨 위에 덮어쓸 레벨 키 (평가 스트레스용, 예: {opening_w: [0.8, 0.85]}) — 평가에서는 항상 이 기본값({})으로 돌아감
  levels:
    - {n_windows: [1, 1], spacing: [3.2, 3.6], lateral: [-0.3, 0.3], corner_noise_px: [1.0, 2.0], miss_prob: [0.0, 0.0]}
    - {n_windows: [1, 2], spacing: [3.0, 3.6], lateral: [-0.5, 0.5], corner_noise_px: [2.0, 4.0], miss_prob: [0.0, 0.05]}
    - {n_windows: [2, 3], spacing: [2.8, 3.6], lateral: [-0.6, 0.6], corner_noise_px: [2.0, 6.0], miss_prob: [0.0, 0.05]}
    - {n_windows: [3, 3], spacing: [2.6, 3.6], lateral: [-0.6, 0.6], corner_noise_px: [2.0, 9.0], miss_prob: [0.0, 0.1]}
    - {n_windows: [3, 5], spacing: [2.6, 3.6], lateral: [-0.6, 0.6], corner_noise_px: [2.0, 9.0], miss_prob: [0.0, 0.1], yaw_deg: [-20.0, 20.0]}
    # L5 스트레스: 실측보다 거친 검출(σ 최대 12 px, 누락 20%), 창문 yaw ±30°, 좁은 간격 — 강건성 비교용
    - {n_windows: [3, 5], spacing: [2.6, 3.2], lateral: [-0.6, 0.6], corner_noise_px: [4.0, 12.0], miss_prob: [0.05, 0.2], yaw_deg: [-30.0, 30.0]}
  extra_levels: []                   # levels 뒤에 붙는 더 어려운 레벨 (학습 프리셋용, 예: configs/train/general.yaml 의 넓은 배치 L6)

# ---------------------------------------------------------------------------
# 도메인 랜덤화 (README §7.1) — 에피소드마다 환경별로 샘플
# ---------------------------------------------------------------------------
domain_randomization:
  enabled: true
  mass_scale: [0.56, 1.0]            # 0.56 ≈ 짐 0 kg (1.2726/2.2726)
  inertia_scale: [0.55, 1.0]
  thrust_scale: [0.9, 1.1]
  drag_scale: [0.5, 1.5]
  motor_time_constant: [0.02, 0.05]
  wind_accel: [0.0, 0.3]             # 일정 외란 가속 크기 [m/s^2] (방향 랜덤 수평)
  blackout_prob: 0.0                 # 에피소드마다 이 확률로 카메라 끊김 구간 1회 (인지 상실 DR, 0 = 끔)
  blackout_start_s: [0.5, 20.0]      # 끊김 시작 시각 [s]
  blackout_len_s: [0.5, 4.0]         # 끊김 길이 [s]
  latency_steps: [0, 0]              # 에피소드마다 검출 지연 [결정 스텝] 정수 균등 (지연 DR, [0, 0] = 끔)
  # --- 범용 강건성 DR (기본 = 끔). 평가에서는 이 절 전체가 default.yaml 값으로 돌아간다 (core/config.py) ---
  gust_accel: [0.0, 0.0]             # 돌풍 세기 σ [m/s^2]: 수평 OU 과정 (시간에 따라 바뀌는 바람, wind_accel 에 더함)
  gust_tau_s: 1.0                    # 돌풍 상관 시간 [s]
  frame_drop_prob: [0.0, 0.0]        # 에피소드마다 프레임 누락 확률 (perception.frame_drop_prob 에 더함)
  latency_jitter_steps: [0, 0]       # 에피소드마다 지연 변동 폭 [결정 스텝] 정수 균등
  pose_drift_m: [0.0, 0.0]           # 에피소드마다 VIO 드리프트 σ [m/√s]
  cam_rot_err_deg: [0.0, 0.0]        # 에피소드마다 카메라 장착 오차 크기 [deg] (축은 임의)
  ctrl_kp_scale: [1.0, 1.0]          # 저수준 제어기 위치 게인 배율 (팀 PID 등 다른 제어기 흉내)
  ctrl_kv_scale: [1.0, 1.0]          # 속도 게인 배율
  ctrl_ki: [0.0, 0.0]                # 속도 적분 게인 [1/s^2] (PX4 식 속도 PID 의 I; 0 = 적분항 없음)
  level_scale: null                  # 레벨별 DR 세기 배율 [L0, L1, ...] (null = 1): 바람·돌풍·끊김 확률·지연·누락·드리프트·장착 오차·제어기 변화에 곱함

# ---------------------------------------------------------------------------
# 상태기계 기준선 (backup/prototype_demo/traj_manager.py 이식) — 같은 인지 추정치를 쓴다
# ---------------------------------------------------------------------------
fsm:
  search_step: 0.6                   # 미검출 시 전진량 [m/결정]
  scan_radius: 2.0                   # 스캔 앵커 = 추정 창문 앞 거리 [m] (traj_manager)
  scan_amp: 0.30                     # 스캔 진폭 [m]
  scan_points: 4                     # 스캔 원호 점 수
  min_parallax_deg: 8.0              # traj_manager min_parallax_deg
  sigma_thr: 0.08                    # 추정 표준편차 역치 [m] (traj_manager stability_thr 80 mm)
  max_scan_rounds: 2
  d_app: 0.6                         # 접근 게이트 [m]
  d_exit: 0.6                        # 이탈 게이트 [m]
  align_back: 0.6                    # 접근 게이트 뒤 정렬점 [m]
  reach_tol: 0.15                    # 웨이포인트 도달 판정 [m]
  z_clip: [0.6, 1.9]

# ---------------------------------------------------------------------------
# 실행 시 안전 필터 (planners/safety.py) — 학습·MDP 에는 영향 없음.
# 온보드(OnboardPlanner)는 기본 적용, 시뮬 평가는 계획기 이름 뒤 "+safe" (예: rl+safe)
# ---------------------------------------------------------------------------
safety:
  enabled: true
  start_grace_s: 0.5                 # 에피소드 시작 후 이 시간 안에 아무 창문도 못 보면 제자리 정지 비행
  lost_hold_s: 3.0                   # 첫 검출 이후: 이 시간 동안 하나도 검출되지 않고 목표를 '모르면' 정지 비행
                                     # (근거: 명목 L5 최장 '모름' 구간 시작 0.3 s / 이후 2.1 s — perception_gaps.py --sigma-safe 0.3)
  sigma_safe_m: 0.3                  # 목표 추정이 유효해도 σ 가 이보다 크면 '모름' (null = 유효하기만 하면 앎)
  fence_margin_m: 0.5                # 웨이포인트를 scene.bounds x/y 안쪽 이 여유까지로 제한 (가상 울타리, 고도는 학습과 같은 제한)

# ---------------------------------------------------------------------------
# 학습 (rsl_rl PPO — Isaac Lab 기본 러너)
# ---------------------------------------------------------------------------
train:
  algorithm: ppo
  max_iterations: 3000
  num_steps_per_env: 48
  save_interval: 100
  log_root: /data/runs/rl_planner
  experiment_name: window_mission
  empirical_normalization: true
  policy:
    actor_hidden_dims: [256, 256, 128]
    critic_hidden_dims: [512, 256, 128]
    activation: elu
    init_noise_std: 0.8
    std_max: null                    # 탐색 잡음 상한 (null = 없음). 행동이 [-1,1] 로 잘리므로 학습 후반 엔트로피 보너스가 잡음을 키운다 (본 학습 0.27→1.6, 미세조정 3.4) — RESULTS §10
    actor_type: mlp                  # mlp | gru | lstm — 순환 정책은 관측 이력을 기억 (export: policy_meta.json 'recurrent')
    rnn_hidden_dim: 128
    rnn_num_layers: 1
  algorithm_cfg:
    learning_rate: 3.0e-4
    schedule: adaptive
    desired_kl: 0.01
    gamma: 0.99
    lam: 0.95
    clip_param: 0.2
    entropy_coef: 0.005
    value_loss_coef: 1.0
    num_learning_epochs: 5
    num_mini_batches: 4
    max_grad_norm: 1.0

# ---------------------------------------------------------------------------
# 평가 (README §7.4) — 같은 씬 집합에서 RL vs 상태기계
# ---------------------------------------------------------------------------
eval:
  num_scenes: 512
  seed: 12345
  level: 3                           # 평가용 커리큘럼 레벨 (3창문, 실측 잡음)
