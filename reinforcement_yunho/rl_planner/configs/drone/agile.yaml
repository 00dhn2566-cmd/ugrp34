# 기체 물리 한계로 날기 (RESULTS.md §15) — 지금까지의 속도·가속 한계는 팀 궤적 파이프라인 값이었다:
#   control_seoungjin traj_bridge.py / traj_pipeline.py PHYS v 2.0 m/s · a 2.0 m/s² (운용: overall_gilnam planner_limits.yaml
#   의 80% = 1.6 / 1.6), 거기에 웨이포인트 보폭 0.8 m × kp_pos 1.6 = 1.28 m/s. 시뮬레이터 기체 (FX450, 추력/무게 2.0) 는 훨씬
#   더 낼 수 있다: 수평 가속은 자세 한계 35° (controller.max_tilt_deg) 가 g·tan35° = 6.9 m/s² 로 묶고, 수직은 추력이 묶는다.
#   속도는 사실상 제한하지 않는다 — 창문 간격 2.6~3.6 m 에서는 가감속만으로 최고 ~4.5 m/s.
#   웜스타트: scripts/rescale_action.py --step-max 3.0 2.0 1.5 (기존 정책과 같은 변위를 명령하도록 출력층 환산)
controller:
  v_max: [10.0, 10.0, 5.0]           # 속도명령 포화 [m/s] — 사실상 없음
  a_max: 9.0                         # 수평 가속 포화 [m/s²] — 이보다 먼저 자세 35° 가 걸린다 (6.9 m/s²)
action:
  step_max: [3.0, 2.0, 1.5]          # 웨이포인트 보폭 [m] (전진 3.0 × kp_pos 1.6 = 4.8 m/s 명령)
domain_randomization:
  exposure_s: [0.0, 0.01]            # 빨리 날면 영상이 번진다: 카메라 노출 0~10 ms (speed.yaml 과 같게, 학습 전용)
