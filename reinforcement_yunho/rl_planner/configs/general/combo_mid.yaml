# 복합 (중간): 잡음 ×1.3, 지연 0.1~0.2 s, 프레임 15% 누락, 바람 0.2~0.5 + 돌풍 0.2, 장착 1°, 초점 1.5%,
# VIO 자세 잡음 (2 cm, 0.3°), 제어기 게인 ×0.85
perception:
  noise_scale: 1.3
  latency_steps: 1
  latency_jitter_steps: 1
  frame_drop_prob: 0.15
  cam_rot_err_deg: 1.0
  calib_fx_scale: 1.015
  pose_noise_m: 0.02
  pose_noise_deg: 0.3
domain_randomization:
  wind_accel: [0.2, 0.5]
  gust_accel: [0.2, 0.2]
  ctrl_kp_scale: [0.85, 0.85]
  ctrl_kv_scale: [0.85, 0.85]
