# 둘러보기 코스 평가 세트 (scripts/benchmark.py --suite rl_planner/configs/scan/suite.yaml) — RESULTS.md §12.
# 모든 조건 = scan/course.yaml (꺾인 코스, 가장 가까운 창문 규칙) 위에 레벨 + 부분 설정. 같은 시드 = 같은 코스·같은 교란.
# 창문 50 개 조건은 레벨 4 (꺾임 ≤ 90°, 높이 변화 ±1.2 m, 창문 기울기 ±30°) 기준. 성공 = 50 개를 규칙대로 모두 통과.
conditions:
  - {name: course_L3, level: 3, configs: [scan/course.yaml], tier: nominal, label: "꺾인 코스 L3 (창문 4~6, 꺾임 ≤ 75°)"}
  - {name: course_L4, level: 4, configs: [scan/course.yaml], tier: nominal, label: "꺾인 코스 L4 (창문 4~8, 꺾임 ≤ 90°, 높이 ±1.2 m)"}
  - {name: course_L5, level: 5, configs: [scan/course.yaml], tier: nominal, label: "꺾인 코스 L5 (창문 5~10, 거친 검출)"}
  - {name: long50_L4, level: 4, configs: [scan/course.yaml, scan/long50.yaml], tier: long, label: "창문 50 개 L4"}
  - {name: long50_L5, level: 5, configs: [scan/course.yaml, scan/long50.yaml], tier: long, label: "창문 50 개 L5 (거친 검출)"}
  - {name: long50_extreme, level: 5, configs: [scan/course.yaml, scan/long50.yaml, scan/extreme.yaml], tier: long, label: "창문 50 개 극한 배치 (높이 ±1.6 m, 기울기 ±40°)"}
  - {name: l50_gust, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/gust.yaml], tier: in_dr, label: "50 개 · 돌풍 σ 0.3 m/s²"}
  - {name: l50_wind_strong, level: 4, configs: [scan/course.yaml, scan/long50.yaml, stress/wind_strong.yaml], tier: in_dr, label: "50 개 · 강풍 0.6~1.0 m/s²"}
  - {name: l50_frame_drop30, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/frame_drop30.yaml], tier: in_dr, label: "50 개 · 프레임 30% 누락"}
  - {name: l50_latency_jitter, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/latency_jitter.yaml], tier: in_dr, label: "50 개 · 검출 지연 0.1~0.2 s"}
  - {name: l50_cam_mount2, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/cam_mount2.yaml], tier: in_dr, label: "50 개 · 카메라 장착 오차 2°"}
  - {name: l50_outage, level: 4, configs: [scan/course.yaml, scan/long50.yaml, scan/outage.yaml], tier: in_dr, label: "50 개 · 카메라 끊김 1~4 s (임의 시각)"}
  - {name: l50_wind_severe, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/wind_severe.yaml], tier: beyond, label: "50 개 · 매우 강한 바람 1.0~1.3 m/s²"}
  - {name: l50_frame_drop50, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/frame_drop50.yaml], tier: beyond, label: "50 개 · 프레임 50% 누락"}
  - {name: l50_latency_severe, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/latency_severe.yaml], tier: beyond, label: "50 개 · 검출 지연 0.3~0.5 s"}
  - {name: l50_cam_mount4, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/cam_mount4.yaml], tier: beyond, label: "50 개 · 카메라 장착 오차 4°"}
  - {name: l50_outage_long, level: 4, configs: [scan/course.yaml, scan/long50.yaml, scan/outage_long.yaml], tier: beyond, label: "50 개 · 카메라 끊김 4~10 s"}
  - {name: l50_narrow, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/narrow.yaml], tier: beyond, label: "50 개 · 좁은 창문 0.85~0.95 m"}
  - {name: l50_vio_drift, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/vio_drift.yaml], tier: held_out, label: "50 개 · VIO 드리프트 0.03 m/√s"}
  - {name: l50_obs_noise_x3, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/obs_noise_x3.yaml], tier: held_out, label: "50 개 · 자기 상태 관측 잡음 ×3"}
  - {name: l50_blur20, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/blur20.yaml], tier: held_out, label: "50 개 · 모션 블러 (노출 20 ms)"}
  - {name: l50_fps5, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/fps5.yaml], tier: held_out, label: "50 개 · 카메라 5 Hz"}
  - {name: l50_heavy, level: 4, configs: [scan/course.yaml, scan/long50.yaml, stress/heavy.yaml], tier: held_out, label: "50 개 · 과중량 (추력/무게 ≈ 1.5)"}
  - {name: l50_combo_mid, level: 4, configs: [scan/course.yaml, scan/long50.yaml, general/combo_mid.yaml], tier: compound, label: "50 개 · 복합 (중간, L4)"}
  - {name: l50_combo_hard, level: 5, configs: [scan/course.yaml, scan/long50.yaml, general/combo_hard.yaml], tier: compound, label: "50 개 · 복합 (거침, L5)"}
  - {name: blind, level: 4, configs: [scan/course.yaml, stress/blind.yaml], tier: safety, label: "검출 전무 (충돌 여부만)"}
