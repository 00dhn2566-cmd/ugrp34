# 창문 높이만큼 긴 줄 (RESULTS.md §15) — configs/slung/base.yaml 뒤에 합친다
#   줄 1.0 m = 개구부 공칭 높이 (opening_h 0.95~1.10): 기체(반높이 0.10) + 갈고리 0.05 + 줄 + 짐(반경 0.12) 이 1.27 m 라
#   짐을 기체 아래에 매단 채로는 개구부에 같이 들어가지 않는다 — 짐을 흔들어 올리거나 (줄이 느슨해지게) 던져서 넘겨야 함.
#   실제 torch 환경에서 행동열을 직접 최적화해 (CEM) 창문 중심 0.8 / 1.2 m, 개구부 1.0 m 에서 통과 해가 있음을 확인.
#   convex layer 는 scp: 시뮬레이터와 같은 당기기만 하는 줄 (장력이 순간 0 이 되면 짐은 자유비행) + 자세 를 넣은 비선형 예측을
#   매 결정 예측 궤적 주변에서 선형화하며 QP 를 반복 (planners/convex_layer.py SlungSCPLayer). 흔들림 각·장력 제한 없음.
drone:
  start_pos: [0.0, 0.0, 1.6]         # 짐이 0.4 m 줄 때와 같은 높이 (0.55 m) 에서 시작 (1.0 m 면 짐이 땅 속)
slung:
  cable_length: 1.0
  convex_layer:
    model: scp
    substeps: 3                      # 0.033 s 스텝 — 아래 무른 모델 줄로 안정
    model_stiffness: 800.0           # 예측 모델 줄 강성 (감쇠비는 실제 줄과 같게): 1 s 예측 오차 드론 0.051 / 짐 0.055 m,
                                     # 짐을 던진 비행 0.090 / 0.048 m (시뮬레이터 줄 그대로 10 스텝: 0.045 / 0.046, 0.088 / 0.045)
    center_weight: 0.0               # 짐과 기체가 개구부에 같이 들어가지 않으니 '가운데로' 는 뜻이 없음
