# 긴 줄 학습 v2 (RESULTS.md §15) — configs/slung/train_long.yaml 뒤에 합친다. slung_agile (s4 초반: 기체 통과 74%, 짐 충돌
#   47%, 성공 13%) 이 '빨리 들이받아 기체만 통과' 에 머문 두 까닭:
#   1. 보상이 짐을 거의 못 본다 — 기체 통과 +10, 충돌 -20, 완주 +20 뿐. 짐이 벽에 처음 닿을 때 개구부 안 여유 (빗나간
#      정도까지) 를 점수로 준다: CEM 이 해를 찾은 점수의 '짐이 창문면에 왔을 때 높이' 항과 같은 것
#   2. 전진 행동이 상자 밖에 박혀 탐색이 죽었다 — 잘리기 전 전진 출력 중앙 6.5, 97% 가 |a| > 1 (탐색 잡음 상한 1.0 이라
#      표본이 모두 +1 로 잘림 = 늘 최대 보폭 3 m). 상자 밖으로 나간 양^2 을 벌한다 (상자 안에서는 0 — 할 수 있는 기동은 그대로)
reward:
  load_clearance: 10.0               # 0.3 m 이상 빗나가면 0, 여유 0.1 m 이상이면 10 (창문마다 한 번)
  action_excess: -0.01               # 전진 출력 6.5 면 스텝당 -0.3
