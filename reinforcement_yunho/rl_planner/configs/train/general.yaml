# 범용 강건성 학습 프리셋 (RESULTS.md §10) — train.py --config rl_planner/configs/train/general.yaml
# 넓은 도메인 랜덤화(바람·돌풍·카메라 끊김·검출 지연·지연 변동·프레임 누락·카메라 장착 오차·제어기 게인/적분항·모터)
# + 넓은 창문 배치 레벨 L6 + 검출 공백 관측 + 비평가에 DR 조건(특권). DR 세기는 커리큘럼 레벨로 키운다(level_scale).
# 평가에서는 domain_randomization 절이 default.yaml 로 돌아가므로 다른 정책과 같은 분포에서 비교된다.
# 일부러 넣지 않은 교란 (일반화 확인용, configs/general/suite.yaml tier held_out): VIO 드리프트·자세 잡음, 관측 잡음,
# 코너 아웃라이어·잡음 배율, 초점 보정, 과중량, 느린 모터(>60 ms), 5 Hz 카메라, 먼 창문, 시작 위치.
observation:
  policy: [lin_vel_heading, gravity_body, ang_vel_body, altitude, last_action, target_estimate, target_detection,
           next_estimate, progress, detection_gap]
  critic: [target_gt, next_gt, estimate_error, dr_params]
domain_randomization:
  motor_time_constant: [0.02, 0.06]
  wind_accel: [0.0, 0.8]
  gust_accel: [0.0, 0.3]
  gust_tau_s: 1.0
  blackout_prob: 0.5
  blackout_start_s: [0.5, 20.0]
  blackout_len_s: [0.5, 10.0]
  latency_steps: [0, 2]
  latency_jitter_steps: [0, 1]
  frame_drop_prob: [0.0, 0.3]
  cam_rot_err_deg: [0.0, 2.0]
  ctrl_kp_scale: [0.7, 1.3]
  ctrl_kv_scale: [0.7, 1.3]
  ctrl_ki: [0.0, 1.0]
  level_scale: [0.0, 0.25, 0.5, 0.75, 1.0, 1.0, 1.0]
curriculum:
  extra_levels:
    # L6 넓은 배치: yaw ±40°, 좌우 ±1 m, 높이 0.7~1.9 m, 좁은 창문 0.85 m 부터, 간격 2.4 m 부터 (잡음은 L5)
    - {n_windows: [3, 5], first_gap: [2.4, 4.0], spacing: [2.4, 3.6], lateral: [-1.0, 1.0], height: [0.7, 1.9],
       yaw_deg: [-40.0, 40.0], opening_w: [0.85, 1.10], opening_h: [0.85, 1.10], corner_noise_px: [4.0, 12.0],
       miss_prob: [0.05, 0.2]}
train:
  policy:
    std_max: 1.0                     # 탐색 잡음 상한 = 행동 범위 반폭 (그 이상은 잘려서 같은 행동; 웜스타트 정책의 3.4 를 1.0 으로)
