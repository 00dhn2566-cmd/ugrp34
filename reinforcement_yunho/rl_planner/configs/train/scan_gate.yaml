# 스캔 게이트 (RESULTS.md §12) — scan.yaml + scan_long.yaml + scan_pass.yaml 위에 겹쳐 쓴다. 웜스타트: scan_e model_6000.
# 통과 직후(시작 포함) 빠져나간 방향 대비 좌우 ±70° 를 돌아보고 통과 고도 대비 위아래 ±0.5 m 를 오르내린 뒤에야 본 창문 중 가장
# 가까운 창문을 고른다 (core/selector.py). 0.3~0.8 m 지나서 멈춘 기체 기준으로 창문 50 개 L4 코스 구간의 96~99.5% 에서 다음 창문이
# 네 코너까지 화면에 들어오는 범위다 (극한 배치 92~96%). 6 s 안에 다 훑지 못하면 그때까지 본 것으로 고른다.
# 게이트 없는 정책은 덜 둘러보고 먼 창문으로 가서 실패의 64% 가 다음 창문을 보기 전에 났다 (scan_e, 창문 50 개 256 코스).
# 한 바퀴 회전도 좌우를 다 본 것으로 친다. 위아래는 고도 1.0~2.4 m 밖으로는 요구하지 않는다 — 창문 중심은 0.8~2.6 m 이고
# 1.0 m 에서는 0.8 m 창문이, 2.4 m 에서는 2.6 m 창문이 2.5 m 앞에서 네 코너까지 화면에 든다 (세로 화각 ±25°).
# 바닥 가까이 내려가거나 경기장 천장(3.5 m)까지 오르지 않게 하려는 것: 첫 시도(이 두 조건 없음)에서 정책은 한쪽으로 돌기만 해
# 좌우 조건을, 낮은 창문 뒤에서 0.5 m 내려가지 않아 위아래 조건을 채우지 못했고, 게이트는 거의 늘 6 s 제한에서 열렸다.
mission:
  scan_yaw_deg: 70.0
  scan_dz_m: 0.5
  scan_z_min: 1.0
  scan_z_max: 2.4
  scan_timeout_s: 6.0
