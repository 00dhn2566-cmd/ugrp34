# 둘러보기 2단계 (RESULTS.md §12): 1단계 정책을 긴 코스·극한 배치에서 이어 학습 — 창문 50 개를 끝까지 가려면 창문당 실패가 0.1% 대여야 한다.
#   train.py ... --config configs/scan/course.yaml --config configs/train/scan.yaml --config configs/train/scan_long.yaml --resume <1단계>
# L6: 창문 10~20 개 (L5 와 같은 배치), L7: 극한 배치 (높이 변화 ±1.6 m, 창문 높이 0.7~2.8 m, 기울기 ±40°, 간격 2.5~5 m, 창문 6~12 개).
scene:
  max_windows: 20
curriculum:
  extra_levels:
    - {n_windows: [10, 20], turn_deg: [0.0, 90.0], rise: [-1.2, 1.2], yaw_deg: [-30.0, 30.0], corner_noise_px: [4.0, 12.0], miss_prob: [0.05, 0.2]}
    - {n_windows: [6, 12], turn_deg: [0.0, 90.0], rise: [-1.6, 1.6], height: [0.7, 2.8], yaw_deg: [-40.0, 40.0], spacing: [2.5, 5.0],
       corner_noise_px: [4.0, 12.0], miss_prob: [0.05, 0.2]}
domain_randomization:
  level_scale: [0.0, 0.25, 0.5, 0.75, 1.0, 1.0, 1.0, 1.0]
